<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Headphones Band -->
  <path d="M 17 33 A 15 15 0 0 1 47 33" fill="none" stroke="url(#primaryGrad)" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Headphones Ear Cups -->
  <rect x="13" y="31" width="7" height="12" rx="3.5" fill="url(#primaryGrad)" filter="url(#glow)"/>
  <rect x="44" y="31" width="7" height="12" rx="3.5" fill="url(#primaryGrad)" filter="url(#glow)"/>

  <!-- Center Target Bullseye (TOEIC Mastery) -->
  <circle cx="32" cy="36" r="6" fill="none" stroke="url(#accentGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="36" r="2.5" fill="#10b981" filter="url(#glow)"/>
</svg>
