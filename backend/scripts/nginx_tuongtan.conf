# ==============================================================================
#   TUONG TAN TOEIC — NGINX PRODUCTION VIRTUAL HOST CONFIGURATION
#   Location on VPS: /etc/nginx/sites-available/tuongtantoeic.conf
#   Enable with: ln -s /etc/nginx/sites-available/tuongtantoeic.conf /etc/nginx/sites-enabled/
# ==============================================================================


server {
    listen 80;
    listen [::]:80;
    server_name toeic.danganhtuong.dev danganhtuong.dev 116.118.3.69;

    # Maximum upload size for scanned images and submissions
    client_max_body_size 25M;

    # Root directory for Frontend React production build
    root /var/www/tuong-tan-toeic/frontend/dist;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Static Assets Caching (Vite bundles with hash)
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Proxy -> Node.js Express Backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for longer requests (e.g., AI evaluations)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint proxy
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router SPA Fallback (Never return 404 on page reload)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
